# DIAG v2: erase the whole settings partition on every boot (same mechanism as the
# settings_reset shield) so both halves pair from scratch each power-on.
# NOTE: do NOT use ZMK_BLE_CLEAR_BONDS_ON_START here: in ZMK v0.3 it marks the BLE
# split transport as unavailable and the central never scans.
CONFIG_ZMK_SETTINGS_RESET_ON_START=y
# DIAG: USB CDC logging with a large buffer so the boot log survives until the host opens the port
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
